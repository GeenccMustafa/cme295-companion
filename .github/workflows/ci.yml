name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
        env:
          HYPOTHESIS_PROFILE: ci
      - name: Run lecture demos
        run: for d in lectures/*/demo.py; do uv run python "$d" > /dev/null || exit 1; done
